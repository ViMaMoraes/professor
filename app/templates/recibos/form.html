{% extends "base.html" %}
{% block titulo %}Novo recibo{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Novo recibo</h1>
{% if not alunos %}
<div class="alert alert-info">Cadastre um aluno antes de gerar recibos. <a href="{{ url_for('alunos.novo') }}">Cadastrar aluno</a></div>
{% else %}
<form method="post" class="card"><div class="card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Aluno *</label>
      <select name="aluno_id" id="aluno_id" class="form-select" required>
        <option value="">Selecione...</option>
        {% for a in alunos %}<option value="{{ a.id }}" {% if dados.aluno_id|string == a.id|string %}selected{% endif %}>{{ a.nome }}</option>{% endfor %}
      </select></div>
    <div class="col-md-3"><label class="form-label">Valor (R$) *</label>
      <input name="valor" id="valor" class="form-control" inputmode="decimal" required placeholder="150,00" value="{{ dados.valor }}"></div>
    <div class="col-md-3"><label class="form-label">Data do pagamento *</label>
      <input type="date" name="data_pagamento" class="form-control" required value="{{ dados.data_pagamento }}"></div>
    <div class="col-md-9"><label class="form-label">Referente a *</label>
      <input name="referente" class="form-control" required value="{{ dados.referente }}"></div>
    <div class="col-md-3"><label class="form-label">Forma de pagamento</label>
      <select name="forma_pagamento" class="form-select">
        {% for fp in formas %}<option {% if dados.forma_pagamento == fp %}selected{% endif %}>{{ fp }}</option>{% endfor %}
      </select></div>
    <div class="col-12"><label class="form-label">Observações</label>
      <input name="observacoes" class="form-control" placeholder="Opcional — aparece no recibo" value="{{ dados.observacoes }}"></div>
  </div>
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-roxo"><i class="bi bi-receipt"></i> Gerar recibo</button>
    <a href="{{ url_for('recibos.lista') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</div></form>
{% endif %}
{% endblock %}
{% block scripts %}
<script>
  // preenche o valor com a mensalidade do aluno escolhido
  const mensalidades = {{ valores_alunos|tojson }};
  document.getElementById('aluno_id')?.addEventListener('change', e => {
    const campo = document.getElementById('valor');
    if (mensalidades[e.target.value]) campo.value = mensalidades[e.target.value];
  });
</script>
{% endblock %}
