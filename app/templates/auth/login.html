{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-music-note-beamed display-4" style="color: var(--roxo)"></i>
    <h1 class="h3 mt-2">Aula de Música</h1>
    <p class="text-muted">Área do professor e do aluno</p>
  </div>
  <div class="card"><div class="card-body p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" required autofocus value="{{ request.form.email }}"></div>
      <div class="mb-3"><label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="lembrar" id="lembrar">
        <label class="form-check-label" for="lembrar">Manter conectado</label></div>
      <button class="btn btn-roxo w-100">Entrar</button>
    </form>
  </div></div>
  <p class="text-center text-muted small mt-3">Aluno sem acesso? Peça seu login ao professor.</p>
</div>
{% endblock %}
