{% extends "base.html" %}
{% block titulo %}Primeiro acesso{% endblock %}
{% block conteudo %}
<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-music-note-beamed display-4" style="color: var(--roxo)"></i>
    <h1 class="h3 mt-2">Bem-vindo!</h1>
    <p class="text-muted">Crie sua conta de professor para começar.</p>
  </div>
  <div class="card"><div class="card-body p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label">Seu nome</label>
        <input name="nome" class="form-control" required value="{{ request.form.nome }}"></div>
      <div class="mb-3"><label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" required value="{{ request.form.email }}"></div>
      <div class="mb-3"><label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" minlength="6" required></div>
      <div class="mb-3"><label class="form-label">Confirmar senha</label>
        <input type="password" name="confirmar" class="form-control" minlength="6" required></div>
      <button class="btn btn-roxo w-100">Criar conta</button>
    </form>
  </div></div>
</div>
{% endblock %}
