{% extends "base.html" %}
{% block titulo %}Configurações{% endblock %}
{% block conteudo %}
<h1 class="h3 mb-3">Configurações</h1>
<form method="post" class="card" style="max-width: 760px"><div class="card-body">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2 class="h6 text-uppercase text-muted">Seus dados (aparecem no recibo)</h2>
  <div class="row g-3 mb-4">
    <div class="col-md-6"><label class="form-label">Nome *</label><input name="nome" class="form-control" required value="{{ prof.nome }}"></div>
    <div class="col-md-6"><label class="form-label">E-mail (login) *</label><input type="email" name="email" class="form-control" required value="{{ prof.email }}"></div>
    <div class="col-md-6"><label class="form-label">CPF ou CNPJ</label><input name="documento" class="form-control" value="{{ prof.documento or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Telefone</label><input name="telefone" class="form-control" value="{{ prof.telefone or '' }}"></div>
    <div class="col-md-8"><label class="form-label">Endereço</label><input name="endereco" class="form-control" value="{{ prof.endereco or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Cidade/UF</label><input name="cidade" class="form-control" placeholder="São Paulo/SP" value="{{ prof.cidade or '' }}"></div>
    <div class="col-md-6"><label class="form-label">Chave Pix</label><input name="chave_pix" class="form-control" value="{{ prof.chave_pix or '' }}">
      <div class="form-text">Aparece no portal do aluno.</div></div>
  </div>
  <h2 class="h6 text-uppercase text-muted">Trocar senha</h2>
  <div class="row g-3 mb-4">
    <div class="col-md-6"><label class="form-label">Senha atual</label><input type="password" name="senha_atual" class="form-control" autocomplete="current-password"></div>
    <div class="col-md-6"><label class="form-label">Nova senha</label><input type="password" name="nova_senha" class="form-control" minlength="6" autocomplete="new-password"></div>
  </div>
  <button class="btn btn-roxo"><i class="bi bi-check-lg"></i> Salvar</button>
</div></form>
{% endblock %}
